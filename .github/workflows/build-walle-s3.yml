name: Build Wall-E RoboEyes ESP32-S3

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wall-e-roboeyes-s3

jobs:
  build-s3:
    name: Build bread-compact-wifi-128x64
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py bread-compact-wifi --name bread-compact-wifi-128x64 --wake-word wn9_jarvis_tts

      - name: Upload merged-binary.bin
        uses: actions/upload-artifact@v4
        with:
          name: bread-compact-wifi-128x64-walle
          path: build/merged-binary.bin
          if-no-files-found: error
